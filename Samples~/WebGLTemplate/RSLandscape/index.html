<!DOCTYPE html>
<html lang="en-us">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <title>Unity WebGL Player | {{{ PRODUCT_NAME }}}</title>
    <!-- Fullscreen game viewport: no user zoom, fit the browser client area. -->
    <meta name="viewport" content="width=device-width, height=device-height, initial-scale=1.0, user-scalable=no, shrink-to-fit=yes, viewport-fit=cover">
    <link rel="stylesheet" href="TemplateData/style.css">
    <!-- Per-build config (fit mode, aspect, background) generated from
         Project Settings > RS WebGL Landscape. Safe to be absent — defaults apply. -->
    <script src="TemplateData/rsconfig.js"></script>
  </head>
  <body>
    <!-- Structure/IDs kept identical to Unity's built-in template so it stays familiar. -->
    <div id="unity-container">
      <canvas id="unity-canvas" width={{{ WIDTH }}} height={{{ HEIGHT }}} tabindex="-1"></canvas>
      <div id="unity-loading-bar">
        <div id="unity-logo"></div>
        <div id="unity-progress-bar-empty">
          <div id="unity-progress-bar-full"></div>
        </div>
      </div>
      <div id="unity-warning"> </div>
    </div>
    <script>
      // ── RS WebGL Landscape template ───────────────────────────────────────
      // Based on Unity's default WebGL template. The ONLY behavioural change is
      // how the canvas is sized: instead of a fixed WIDTH x HEIGHT box, the
      // canvas is fitted to the browser viewport according to the config below.
      //
      // Values come from window.RSConfigOverride (TemplateData/rsconfig.js),
      // which is generated on build from Project Settings > RS WebGL Landscape
      // (real enum dropdown / color picker). If that file/values are absent, the
      // defaults below apply. WIDTH/HEIGHT fall back to Player Settings' Default
      // Canvas size ({{{ WIDTH }}}x{{{ HEIGHT }}}).
      //
      // Fit modes:
      //   "aspect"  – KHUYẾN NGHỊ cho package này. Giữ đúng tỷ lệ thiết kế và
      //               letterbox (viền), NHƯNG tự lật tỷ lệ theo hướng viewport:
      //               màn ngang → canvas ngang (vd 1.6), màn dọc → canvas dọc
      //               (vd 0.625). Nhờ vậy canvas dọc vẫn cao hơn rộng nên
      //               WebGLOrientationAdapter nhận diện đúng portrait và xoay
      //               nội dung; đồng thời desktop/màn ngang lệch tỷ lệ không bị
      //               cắt cạnh — chỉ cần bắt tỷ lệ ở CSS, adapter giữ nguyên.
      //   "expand"  – canvas phủ kín 100% viewport (không giữ tỷ lệ, để adapter
      //               tự lo mọi thứ). Có thể bị lòi/cắt trên màn lệch tỷ lệ.
      //   "contain" – giữ đúng tỷ lệ CỐ ĐỊNH (không lật), letterbox.
      //   "cover"   – giữ tỷ lệ cố định, phủ kín viewport bằng cách cắt bớt.
      //   "stretch" – kéo dãn lấp đầy, KHÔNG giữ tỷ lệ.
      var _rsOverride = (typeof window !== "undefined" && window.RSConfigOverride) ? window.RSConfigOverride : {};
      var RSConfig = {
        fitMode:    _rsOverride.fitMode || "aspect",
        aspectW:    (_rsOverride.aspectW > 0) ? _rsOverride.aspectW : {{{ WIDTH }}},
        aspectH:    (_rsOverride.aspectH > 0) ? _rsOverride.aspectH : {{{ HEIGHT }}},
        background: _rsOverride.background || "#231F20",
        maxDevicePixelRatio: _rsOverride.maxDevicePixelRatio || 0,
      };

      var container = document.querySelector("#unity-container");
      var canvas = document.querySelector("#unity-canvas");
      var loadingBar = document.querySelector("#unity-loading-bar");
      var progressBarFull = document.querySelector("#unity-progress-bar-full");
      var warningBanner = document.querySelector("#unity-warning");

      document.body.style.background = RSConfig.background;
      container.style.background = RSConfig.background;

      // Shows a temporary message banner/ribbon for a few seconds, or
      // a permanent error message on top of the canvas if type=='error'.
      function unityShowBanner(msg, type) {
        function updateBannerVisibility() {
          warningBanner.style.display = warningBanner.children.length ? 'block' : 'none';
        }
        var div = document.createElement('div');
        div.innerHTML = msg;
        warningBanner.appendChild(div);
        if (type == 'error') div.style = 'background: red; padding: 10px;';
        else {
          if (type == 'warning') div.style = 'background: yellow; padding: 10px;';
          setTimeout(function() {
            warningBanner.removeChild(div);
            updateBannerVisibility();
          }, 5000);
        }
        updateBannerVisibility();
      }

      // ── Canvas fit logic (the only real change vs. Unity's template) ──────
      // Sizes the canvas' CSS box to the viewport per RSConfig.fitMode. Unity's
      // WebGL runtime matches the WebGL render-target to this CSS box times the
      // device pixel ratio (config.matchWebGLToCanvasSize, on by default), so
      // setting the CSS size here is enough to drive the actual resolution.
      function applyCanvasFit() {
        var vw = window.innerWidth;
        var vh = window.innerHeight;
        var mode = RSConfig.fitMode;
        var w, h;

        if (mode === "expand" || mode === "stretch") {
          // Fill the whole viewport. Unity (and this package's orientation
          // adapter) reacts to the real window dimensions.
          w = vw;
          h = vh;
        } else if (mode === "aspect") {
          // Keep the design aspect, but orient it to match the viewport so a
          // portrait window still gets a portrait-shaped (tall) canvas — the
          // in-Unity adapter then sees portrait and rotates the content. The
          // design's long/short sides map to the viewport's long/short sides.
          var dLong  = Math.max(RSConfig.aspectW, RSConfig.aspectH);
          var dShort = Math.min(RSConfig.aspectW, RSConfig.aspectH);
          var portrait = vh > vw;
          var ar = portrait ? (dShort / dLong) : (dLong / dShort); // target canvas aspect
          var vAr = vw / vh;
          // Letterbox: fit entirely inside the viewport, keep aspect.
          if (vAr > ar) { h = vh; w = h * ar; }
          else          { w = vw; h = w / ar; }
        } else {
          var ar2 = RSConfig.aspectW / RSConfig.aspectH;  // fixed design aspect (no flip)
          var vAr2 = vw / vh;
          if (mode === "cover") {
            // Fill viewport, crop overflow.
            if (vAr2 > ar2) { w = vw; h = w / ar2; }
            else            { h = vh; w = h * ar2; }
          } else { // "contain": letterbox, keep the fixed aspect fully visible
            if (vAr2 > ar2) { h = vh; w = h * ar2; }
            else            { w = vw; h = w / ar2; }
          }
        }

        canvas.style.width  = Math.round(w) + "px";
        canvas.style.height = Math.round(h) + "px";
      }

      window.addEventListener("resize", applyCanvasFit);
      window.addEventListener("orientationchange", function () {
        // Some browsers report stale innerWidth/innerHeight on the change event;
        // re-apply once things have settled.
        applyCanvasFit();
        setTimeout(applyCanvasFit, 300);
      });
      applyCanvasFit();

      var buildUrl = "Build";
      var loaderUrl = buildUrl + "/{{{ LOADER_FILENAME }}}";
      var config = {
        dataUrl: buildUrl + "/{{{ DATA_FILENAME }}}",
        frameworkUrl: buildUrl + "/{{{ FRAMEWORK_FILENAME }}}",
        codeUrl: buildUrl + "/{{{ CODE_FILENAME }}}",
#if MEMORY_FILENAME
        memoryUrl: buildUrl + "/{{{ MEMORY_FILENAME }}}",
#endif
#if SYMBOLS_FILENAME
        symbolsUrl: buildUrl + "/{{{ SYMBOLS_FILENAME }}}",
#endif
        streamingAssetsUrl: "StreamingAssets",
        companyName: {{{ JSON.stringify(COMPANY_NAME) }}},
        productName: {{{ JSON.stringify(PRODUCT_NAME) }}},
        productVersion: {{{ JSON.stringify(PRODUCT_VERSION) }}},
        showBanner: unityShowBanner,
      };

      // Keep the WebGL render-target locked to the canvas' CSS size (default).
      // Leave this on so the fit logic above drives the real resolution.
      config.matchWebGLToCanvasSize = true;

      if (RSConfig.maxDevicePixelRatio > 0) {
        config.devicePixelRatio = Math.min(window.devicePixelRatio || 1, RSConfig.maxDevicePixelRatio);
      }

      loadingBar.style.display = "block";

      var script = document.createElement("script");
      script.src = loaderUrl;
      script.onload = () => {
        createUnityInstance(canvas, config, (progress) => {
          progressBarFull.style.width = 100 * progress + "%";
        }).then((unityInstance) => {
          loadingBar.style.display = "none";
          window.unityInstance = unityInstance;
          applyCanvasFit();
        }).catch((message) => {
          alert(message);
        });
      };
      document.body.appendChild(script);
    </script>
  </body>
</html>
